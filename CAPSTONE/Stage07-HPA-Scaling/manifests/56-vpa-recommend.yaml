# Stage 07: let the VPA (installed on Day 09) RECOMMEND sizes for web and
# redis. updateMode "Off" = never evicts or changes anything; just read
# `kubectl -n capstone describe vpa`.
#
# No VPA on api: the HPA scales api on CPU, and a VPA changing the same
# Pods' CPU requests would move the HPA's target under it (they fight).
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: web
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone, tier: web }
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: linkerd-proxy
        mode: "Off"             # sized by Linkerd annotations, not by VPA
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: redis
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone, tier: data }
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: redis
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: linkerd-proxy
        mode: "Off"
