# The anti-pattern: a wildcard Role ("do anything to anything in this
# namespace") bound to a ServiceAccount, the way a rushed "just make it
# work" fix often ends up looking.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: overprivileged-sa
  namespace: day11-security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: overprivileged-role
  namespace: day11-security
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: overprivileged-binding
  namespace: day11-security
subjects:
  - kind: ServiceAccount
    name: overprivileged-sa
    namespace: day11-security
roleRef:
  kind: Role
  name: overprivileged-role
  apiGroup: rbac.authorization.k8s.io
