# ex07 · step 2 — the workload the human user is allowed to VIEW (read-only)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: rbac-user-pod-demo
  labels:
    app: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 200m, memory: 64Mi }
