# ex06 · step 3 — the identity that will act as our "limited operator"
#
# On k3s / Kubernetes 1.24+ a ServiceAccount NO LONGER gets an auto-generated
# token Secret. To get a token you either:
#   - kubectl create token nginx-operator -n rbac-nginx-demo      (short-lived)
#   - mount it into a Pod via serviceAccountName (see 05-operator-pod.yaml)
#   - create a long-lived token Secret explicitly (see README, troubleshooting)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-operator
  namespace: rbac-nginx-demo
