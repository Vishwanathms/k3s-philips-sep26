apiVersion: v1
kind: Secret
metadata:
  name: canary-secret
  namespace: day11-security
type: Opaque
stringData:
  password: THIS-EXACT-STRING-MUST-NOT-APPEAR-IN-PLAINTEXT-ON-DISK-9f8e7d6c
