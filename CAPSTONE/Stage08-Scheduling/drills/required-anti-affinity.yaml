# Drill S3: the same spreading rule as api/web, but REQUIRED.
# 2 replicas that each refuse to share a node with the other. On a
# single-node cluster the 2nd one can never be placed: it stays Pending.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread-strict
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone, tier: drill }
spec:
  replicas: 2
  selector:
    matchLabels: { app: spread-strict }
  template:
    metadata:
      labels: { app: spread-strict, tier: drill, app.kubernetes.io/part-of: capstone }
      annotations:
        linkerd.io/inject: disabled      # keep the drill Pod small
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app: spread-strict }
      containers:
        - name: sleep
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
