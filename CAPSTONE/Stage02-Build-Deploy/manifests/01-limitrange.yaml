# Per-container defaults and bounds for anything created in `capstone`.
# Our own manifests set resources explicitly; this catches everything else
# (a quick `kubectl run` debug Pod, a teammate's copy-paste) so no container
# ends up BestEffort by accident.
apiVersion: v1
kind: LimitRange
metadata:
  name: capstone-defaults
  namespace: capstone
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m,  memory: 64Mi }    # used when requests are omitted
      default:        { cpu: 200m, memory: 128Mi }   # used when limits are omitted
      max:            { cpu: "1",  memory: 512Mi }   # nothing bigger is admitted
