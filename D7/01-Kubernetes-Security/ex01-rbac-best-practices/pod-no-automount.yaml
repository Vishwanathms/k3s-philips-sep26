# A Pod that never calls the Kubernetes API doesn't need a token mounted at
# all - automountServiceAccountToken: false removes an entire attack surface
# (a stolen/leaked token from this Pod is simply useless).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: no-api-access-sa
  namespace: day11-security
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: no-token-pod
  namespace: day11-security
spec:
  serviceAccountName: no-api-access-sa
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 32Mi }
