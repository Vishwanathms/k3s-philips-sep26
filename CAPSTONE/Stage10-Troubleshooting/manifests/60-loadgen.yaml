# Stage 06: steady background traffic, so the mesh always has something to
# measure. ~4 requests/s through the web tier (web -> api -> redis), the same
# path a browser takes. It's meshed too, so it shows up as a client in
# `linkerd viz edges`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone, tier: loadgen }
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen, tier: loadgen, app.kubernetes.io/part-of: capstone }
    spec:
      priorityClassName: capstone-batch    # Stage 08: lowest, never preempts
      serviceAccountName: loadgen           # Stage 09
      # Stage 09: busybox would run as root; run it as `nobody`.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: loadgen
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O /dev/null http://web/api/hits; wget -q -O /dev/null http://web/api/info; sleep 0.5; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
