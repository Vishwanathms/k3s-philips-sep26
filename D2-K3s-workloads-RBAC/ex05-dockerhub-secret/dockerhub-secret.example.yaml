# ex05 - TEMPLATE ONLY. Do not commit a real one.
#
# Prefer creating this with `kubectl create secret docker-registry` (see README);
# it builds the .dockerconfigjson for you. This file just shows the shape.
#
# The single key `.dockerconfigjson` holds base64 of:
#   {"auths":{"https://index.docker.io/v1/":{"username":"USER","password":"PAT",
#             "auth":"<base64 of USER:PAT>"}}}
apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-creds
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: PASTE_BASE64_DOCKERCONFIGJSON_HERE
