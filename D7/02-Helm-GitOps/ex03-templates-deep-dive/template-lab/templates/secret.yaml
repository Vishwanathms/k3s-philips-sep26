# `required` turns a missing value into a hard template-render failure,
# BEFORE anything ever reaches the API server - a real fail-fast guard
# against "it rendered fine but the app crashed because a secret was empty."
{{- if .Values.apiKeyEnabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "template-lab.fullname" . }}-secret
type: Opaque
stringData:
  api-key: {{ required "apiKey must be set when apiKeyEnabled is true" .Values.apiKey }}
{{- end }}
