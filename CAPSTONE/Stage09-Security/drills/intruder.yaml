# Drill: an "attacker" Pod inside the capstone namespace.
#
# - NOT meshed (linkerd.io/inject: disabled), so its connections go straight
#   onto the network and you see what the NetworkPolicy itself does. k3s's
#   policy controller REJECTS, so a blocked connection fails in ~1s with
#   "Connection refused" (other CNIs, e.g. Calico, silently drop: a timeout).
#   Meshed Pods get a 502/504 from their own proxy instead: the proxy
#   accepted locally, then failed upstream.
# - Passes PSA `restricted` - the namespace would reject it otherwise. Pod
#   Security limits WHAT a Pod may do, not WHETHER someone may create one.
#   That's RBAC's job.
apiVersion: v1
kind: Pod
metadata:
  name: intruder
  namespace: capstone
  labels: { app: intruder }
  annotations:
    linkerd.io/inject: disabled
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 32Mi }
