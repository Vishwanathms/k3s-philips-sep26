# Stage 09: one identity per tier instead of everyone sharing `default`.
# - RBAC can now be granted per tier (none of them needs any today).
# - Linkerd uses the ServiceAccount as the mTLS identity, so `linkerd viz
#   edges` shows web.capstone -> api.capstone instead of default -> default.
# automountServiceAccountToken: false - no Kubernetes API token is mounted
# into the app containers. None of them talks to the API, so a stolen token
# would be pure risk. (Linkerd mounts its own short-lived, audience-bound
# token for the proxy only; that's unaffected.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone, tier: web }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone, tier: api }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone, tier: data }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loadgen
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone, tier: loadgen }
automountServiceAccountToken: false
