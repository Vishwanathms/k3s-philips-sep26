# Stage 06: the Linkerd viz dashboard through Traefik, like the app itself.
# http://linkerd-viz.k3s.local/ (add it to your hosts file next to
# capstone.k3s.local). The dashboard only answers to host names it was
# installed with: see `dashboard.enforcedHostRegexp` in the LAB-MANUAL.
# No login: fine on a lab VM, never on a shared cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkerd-viz
  namespace: linkerd-viz
  labels: { app.kubernetes.io/part-of: capstone }
spec:
  ingressClassName: traefik
  rules:
    - host: linkerd-viz.k3s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8084
