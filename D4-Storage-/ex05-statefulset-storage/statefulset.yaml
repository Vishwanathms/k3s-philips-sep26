# ex05 - a StatefulSet with volumeClaimTemplates: each replica gets its OWN
# PVC (created automatically, one per pod, named "<template>-<pod-name>"),
# not one shared PVC like a Deployment would if you tried the same trick.
# Uses the same default "local-path" StorageClass as ex01.
apiVersion: v1
kind: Service
metadata:
  name: counter
  namespace: d4-storage
spec:
  clusterIP: None          # headless - required for a StatefulSet's stable DNS
  selector: { app: counter }
  ports: [{ port: 80 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: counter
  namespace: d4-storage
spec:
  serviceName: counter
  replicas: 2
  selector:
    matchLabels: { app: counter }
  template:
    metadata:
      labels: { app: counter }
    spec:
      containers:
        - name: counter
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "I am $(hostname), first boot at $(date)" >> /data/identity.log
              while true; do date >> /data/identity.log; sleep 5; done
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 50Mi }
