apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "template-lab.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "template-lab.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "template-lab.fullname" . }}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: {{ .Values.resourceLimits.cpu }}
              memory: {{ .Values.resourceLimits.memory }}
