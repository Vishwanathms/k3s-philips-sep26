# ex01 - a throwaway Pod used only to prove scheduling is disabled while
# the node is cordoned. Cordoning does NOT touch anything already running.
apiVersion: v1
kind: Pod
metadata:
  name: cordon-test
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: 10m, memory: 8Mi }
