# Everything the "restricted" Pod Security Standard exists to reject:
# privileged mode, root, no capability drops, no seccomp profile.
apiVersion: v1
kind: Pod
metadata:
  name: privileged-pod
  namespace: day11-security
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true
