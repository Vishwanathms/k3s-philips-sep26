# ex01 - simplest possible workload: an nginx Deployment + a Service to reach it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-pod
  labels:
    app: nginx-pod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-pod
  template:
    metadata:
      labels:
        app: nginx-pod
    spec:
      containers:
        - name: nginx1
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-pod
  labels:
    app: nginx-pod
spec:
  # NodePort so you can curl it from the host without touching Traefik (which
  # owns ports 80/443). k3s picks a port in 30000-32767.
  type: NodePort
  selector:
    app: nginx-pod
  ports:
    - name: http
      port: 80
      targetPort: 80
