# WEB tier: nginx built from CAPSTONE/app/web. Serves the page and
# proxies /api/ to the `api` Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone, tier: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web, tier: web, app.kubernetes.io/part-of: capstone }
    spec:
      containers:
        - name: web
          image: capstone-web    # registry + tag are set in kustomization.yaml
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: api:8000
          resources:
            requests: { cpu: 25m,  memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }
          # Both probes check nginx itself, never the API behind it: a slow
          # API must not take the whole front end out of the Ingress.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone, tier: web }
spec:
  selector: { app: web }
  ports:
    - name: http
      port: 80
      targetPort: http
