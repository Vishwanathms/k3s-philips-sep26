apiVersion: v1
kind: Pod
metadata:
  name: allowed-client
  namespace: day02-networking
  labels: { access: web-allowed }
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: blocked-client
  namespace: day02-networking
  labels: { access: web-blocked }
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
  restartPolicy: Never
