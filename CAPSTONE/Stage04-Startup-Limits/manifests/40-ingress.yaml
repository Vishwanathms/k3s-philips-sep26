# Entry point: Traefik (Day 05) routes capstone.k3s.local to the web tier.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capstone
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone }
spec:
  ingressClassName: traefik
  rules:
    - host: capstone.k3s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
