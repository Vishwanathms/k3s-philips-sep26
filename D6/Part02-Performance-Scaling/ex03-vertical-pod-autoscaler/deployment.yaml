# ex03 - deliberately UNDER-provisioned: requests.cpu: 10m, but the
# container actually does real, continuous work (hashing 1MB of random
# data in a loop) that uses noticeably more than that. This is the
# realistic "nobody load-tested this before setting requests" scenario
# VPA's recommender is built to catch.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rightsize-me
  namespace: day09-scaling
spec:
  replicas: 1
  selector:
    matchLabels: { app: rightsize-me }
  template:
    metadata:
      labels: { app: rightsize-me }
    spec:
      containers:
        - name: hasher
          image: busybox:1.36
          command:
            - sh
            - -c
            - "while true; do dd if=/dev/urandom bs=1M count=1 2>/dev/null | md5sum >/dev/null; done"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 500m, memory: 128Mi }
