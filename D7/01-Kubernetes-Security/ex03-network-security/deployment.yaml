# Two workloads in the same namespace: a "web" tier and a "db" tier, plus a
# throwaway client Pod used to test what can and can't reach them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: day11-security
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: day11-security
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: day11-security
spec:
  replicas: 1
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
        - name: pause
          image: busybox:1.36
          command: ["sh", "-c", "nc -lk -p 5432 -e echo db-response"]
          ports: [{ containerPort: 5432 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: day11-security
spec:
  selector: { app: db }
  ports: [{ port: 5432, targetPort: 5432 }]
