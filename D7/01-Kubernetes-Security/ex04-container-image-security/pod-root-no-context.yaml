# Not privileged, but no securityContext at all - "restricted" requires an
# explicit runAsNonRoot/allowPrivilegeEscalation/capabilities/seccompProfile,
# it doesn't infer safe defaults for you.
apiVersion: v1
kind: Pod
metadata:
  name: root-no-context-pod
  namespace: day11-security
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
