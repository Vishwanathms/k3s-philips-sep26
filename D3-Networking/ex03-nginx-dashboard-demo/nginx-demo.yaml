# A minimal nginx app to look at in the Traefik dashboard (Lab 6).
# Every object below shows up as its own piece of the request path:
#   Ingress     -> HTTP Router   (rule: Host(`nginx.k3s.local`))
#   Middleware  -> HTTP Middleware (adds a response header)
#   Service     -> HTTP Service, with one "server" per nginx Pod IP
apiVersion: v1
kind: Namespace
metadata:
  name: d3-networking
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-page
  namespace: d3-networking
data:
  # nginx answers with its own Pod name ($hostname), so repeated requests
  # show Traefik load-balancing across the replicas.
  default.conf: |
    server {
      listen 80;
      location / {
        default_type text/plain;
        return 200 "Hello from nginx pod: $hostname\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: d3-networking
spec:
  replicas: 2
  selector:
    matchLabels: {app: nginx}
  template:
    metadata:
      labels: {app: nginx}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: nginx-page
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: d3-networking
spec:
  selector: {app: nginx}
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: add-demo-header
  namespace: d3-networking
spec:
  headers:
    customResponseHeaders:
      X-Served-Via: traefik-dashboard-demo
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: d3-networking
  annotations:
    # <namespace>-<middleware-name>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: d3-networking-add-demo-header@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: nginx.k3s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
