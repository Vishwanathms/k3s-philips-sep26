# Drill S5: ONE low-priority Pod that requests almost all of the node's free
# CPU, so the next redis Pod has no room and must preempt it.
# Don't apply this file directly: drills/fill-node.sh replaces FILL_CPU with
# "node's free CPU minus 50m" and applies it.
# Own namespace: no LimitRange/ResourceQuota, not meshed.
apiVersion: v1
kind: Namespace
metadata:
  name: capstone-filler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filler
  namespace: capstone-filler
spec:
  replicas: 1
  selector:
    matchLabels: { app: filler }
  template:
    metadata:
      labels: { app: filler }
    spec:
      priorityClassName: capstone-batch     # -100: the first to go
      terminationGracePeriodSeconds: 5
      containers:
        - name: sleep
          image: busybox:1.36
          command: ["sleep", "86400"]
          resources:
            requests: { cpu: FILL_CPU, memory: 16Mi }
            limits:   { cpu: FILL_CPU, memory: 32Mi }
