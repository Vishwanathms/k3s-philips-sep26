# ex01 - the Pod that consumes data-claim. Scheduling THIS Pod is what
# finally triggers local-path-provisioner to create the PersistentVolume
# (WaitForFirstConsumer). It appends one line to /data/log every 2s so we
# can prove the file survives across Pod restarts.
apiVersion: v1
kind: Pod
metadata:
  name: writer
  namespace: d4-storage
  labels: { app: writer }
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /data/log; sleep 2; done"]
      volumeMounts:
        - { name: data, mountPath: /data }
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-claim
