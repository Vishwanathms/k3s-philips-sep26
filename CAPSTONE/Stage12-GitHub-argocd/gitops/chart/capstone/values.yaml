# Default values for the capstone chart.
# Only the fields a real upgrade/rollback exercise actually touches are
# exposed here (image tags, web replica count, api's HPA range). Everything
# else (probes, QoS, affinity, NetworkPolicies) is fixed in the templates,
# unchanged from Stage 10 - a first chart should package what already
# works, not invent new knobs nobody asked for.

api:
  image:
    repository: localhost:5000/capstone-api
    tag: "1.0.0"
  hpa:
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60

web:
  image:
    repository: localhost:5000/capstone-web
    tag: "1.0.0"
  replicaCount: 2

redis:
  image: redis:7-alpine
  # The password Secret is created ONCE, outside this chart
  # (scripts/create-redis-secret.sh, same as Stage 09) and never
  # regenerated by an upgrade - rotating it needs a deliberate restart of
  # both redis and api, not a side effect of `helm upgrade`.
  existingSecret: redis-auth

ingress:
  host: capstone.k3s.local

quota:
  pods: "15"
  requestsCpu: "1"
  requestsMemory: 1Gi
  limitsCpu: "6"
  limitsMemory: 3Gi
