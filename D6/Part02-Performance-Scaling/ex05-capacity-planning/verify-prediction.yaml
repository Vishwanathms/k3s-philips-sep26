# ex05 - deploy MORE replicas than capacity-math.sh predicted will fit
# (16, when the prediction for this profile was 14), to prove the
# prediction against the real scheduler rather than just trust the math.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-test
  namespace: day09-scaling
spec:
  replicas: 16
  selector:
    matchLabels: { app: capacity-test }
  template:
    metadata:
      labels: { app: capacity-test }
    spec:
      containers:
        - name: filler
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 250m, memory: 256Mi }
