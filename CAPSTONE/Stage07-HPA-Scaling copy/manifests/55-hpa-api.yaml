# Stage 07: scale the API tier on CPU, 2 -> 6 Pods.
#
# ContainerResource, not Resource: every api Pod also runs a linkerd-proxy
# (Stage 06). A plain `Resource` CPU metric averages the WHOLE Pod (api +
# proxy) against the whole Pod's requests, so the proxy's CPU would skew the
# number. This watches only the `api` container.
#
# 60% of the api container's request (50m) = ~30m CPU per Pod on average.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone, tier: api }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2          # never below 2: the PDB (Stage 05) and HA need it
  maxReplicas: 6          # the ResourceQuota is sized for this
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: api
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    # Default scale-down waits 300s after load drops. 60s here, so a class
    # sees the full 2 -> N -> 2 cycle. Production usually keeps 300s or more.
    scaleDown:
      stabilizationWindowSeconds: 60
