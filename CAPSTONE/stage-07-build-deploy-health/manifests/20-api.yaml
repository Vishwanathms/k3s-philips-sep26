# APP tier: the python API built from CAPSTONE/app/api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone, tier: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api, tier: api, app.kubernetes.io/part-of: capstone }
    spec:
      containers:
        - name: api
          image: capstone-api    # registry + tag are set in kustomization.yaml
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_HOST
              value: redis
          # Burstable: guaranteed a small slice, allowed to burst under load.
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          # /ready pings redis. Redis down => API Pods leave the Service,
          # the web tier returns 502/503, and nothing is restarted.
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          # /healthz never touches redis: only a hung/dead process fails it.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone, tier: api }
spec:
  selector: { app: api }
  ports:
    - name: http
      port: 8000
      targetPort: http
