# Meets the "restricted" Pod Security Standard: non-root, no privilege
# escalation, every Linux capability dropped, the runtime's default seccomp
# profile, read-only root filesystem.
apiVersion: v1
kind: Pod
metadata:
  name: hardened-pod
  namespace: day11-security
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 32Mi }
