# WEB tier: nginx built from CAPSTONE/app/web. Serves the page and
# proxies /api/ to the `api` Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone, tier: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web, tier: web, app.kubernetes.io/part-of: capstone }
    spec:
      priorityClassName: capstone-app
      # Stage 08: PREFER to put web replicas on different nodes, so one node
      # failing doesn't take the whole tier. `preferred` = a score, not a rule:
      # on a single node all replicas still run there. (`required` would leave
      # the 2nd replica Pending forever here: see drills/.)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: web }
      containers:
        - name: web
          image: localhost:5000/capstone-web:1.0.0   # registry/name:tag: change here to switch registry
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: api:8000
          resources:
            requests: { cpu: 25m,  memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }
          # Both probes check nginx itself, never the API behind it: a slow
          # API must not take the whole front end out of the Ingress.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone, tier: web }
spec:
  selector: { app: web }
  ports:
    - name: http
      port: 80
      targetPort: http
