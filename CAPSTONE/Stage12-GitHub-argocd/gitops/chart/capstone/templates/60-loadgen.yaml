# Steady background traffic, so there's always something for the mesh (and
# the counter) to show.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: capstone, tier: loadgen }
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen, tier: loadgen, app.kubernetes.io/part-of: capstone }
    spec:
      priorityClassName: capstone-batch
      serviceAccountName: loadgen
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: loadgen
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O /dev/null http://web/api/hits; wget -q -O /dev/null http://web/api/info; sleep 0.5; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
