# Entry point: Traefik routes {{ .Values.ingress.host }} to the web tier.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capstone
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: capstone }
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
