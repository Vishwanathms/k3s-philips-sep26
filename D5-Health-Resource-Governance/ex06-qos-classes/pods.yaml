# ex06 - the three QoS classes Kubernetes derives PURELY from how
# requests/limits are set - nothing else about these Pods differs.
apiVersion: v1
kind: Pod
metadata:
  name: qos-guaranteed
  namespace: d5-health
  labels: { qos-demo: "true" }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: 100m, memory: 64Mi }
        limits: { cpu: 100m, memory: 64Mi }     # requests == limits, EVERY resource
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-burstable
  namespace: d5-health
  labels: { qos-demo: "true" }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: 50m, memory: 32Mi }
        limits: { cpu: 200m, memory: 128Mi }    # limits > requests
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-besteffort
  namespace: d5-health
  labels: { qos-demo: "true" }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      # no resources: block at all - and no LimitRange in this namespace
      # this time, so nothing gets filled in either
