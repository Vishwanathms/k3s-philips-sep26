# ex03 - two independent Pods, same PVC, at the same time - the RWX proof.
apiVersion: v1
kind: Pod
metadata:
  name: nfs-writer
  namespace: d4-storage
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "echo from-nfs-writer > /data/shared.txt && sleep 3600"]
      volumeMounts: [{ name: data, mountPath: /data }]
  volumes:
    - name: data
      persistentVolumeClaim: { claimName: nfs-claim }
---
apiVersion: v1
kind: Pod
metadata:
  name: nfs-reader
  namespace: d4-storage
spec:
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts: [{ name: data, mountPath: /data }]
  volumes:
    - name: data
      persistentVolumeClaim: { claimName: nfs-claim }
