# ex04a - requests scheduling: this Pod asks for more CPU than the entire
# node has (this node is allocatable for 4 cores). The scheduler can never
# place it - it stays Pending forever, with a specific reason in its events.
# Nothing here is about limits; this is what REQUESTS are actually for -
# the scheduler's bin-packing input.
apiVersion: v1
kind: Pod
metadata:
  name: too-big-to-schedule
  namespace: d5-health
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "10"          # this node only has 4 allocatable cores
          memory: 256Mi
