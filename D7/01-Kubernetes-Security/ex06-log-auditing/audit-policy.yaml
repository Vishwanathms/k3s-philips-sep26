# Minimal, deliberately narrow audit policy: log full request+response
# bodies for Secrets (the highest-value target) and exec/attach (the
# highest-risk action), request metadata only for everything else, and
# skip noisy read-only system traffic entirely. A real production policy
# tunes this much further - this is intentionally small so the audit log
# stays readable for the lab.
apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  # Don't bother logging routine health/watch noise from system components.
  - level: None
    users: ["system:kube-scheduler", "system:kube-controller-manager", "system:apiserver"]
  - level: None
    resources:
      - group: ""
        resources: ["events"]
  - level: None
    nonResourceURLs: ["/healthz*", "/livez*", "/readyz*", "/metrics"]

  # Secrets: log the full request AND response body - exactly what was
  # read/written, by whom.
  - level: RequestResponse
    resources:
      - group: ""
        resources: ["secrets"]

  # Exec/attach into a running container: also worth the full detail.
  - level: RequestResponse
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach"]

  # Everything else: just metadata (who, what, when - no bodies).
  - level: Metadata
