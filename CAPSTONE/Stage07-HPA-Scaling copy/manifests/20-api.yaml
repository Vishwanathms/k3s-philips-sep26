# APP tier: the python API built from CAPSTONE/app/api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone, tier: api }
spec:
  # No `replicas:` from Stage 07 on: the HPA (55-hpa-api.yaml) owns the
  # count. With it here, every `kubectl apply` would reset api to 2 Pods,
  # even in the middle of a scale-up.
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api, tier: api, app.kubernetes.io/part-of: capstone }
    spec:
      containers:
        - name: api
          image: localhost:5000/capstone-api:1.0.0   # registry/name:tag: change here to switch registry
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_HOST
              value: redis
          # Burstable: guaranteed a small slice, allowed to burst under load.
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          # /ready pings redis. Redis down => API Pods leave the Service,
          # the web tier returns 502/503, and nothing is restarted.
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          # Started = gunicorn answers at all. Up to 60s (30 x 2s) to boot,
          # after which liveness takes over with its strict 30s budget.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # /healthz never touches redis: only a hung/dead process fails it.
          # No initialDelaySeconds: the startup probe already covers boot.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: capstone
  labels: { app.kubernetes.io/part-of: capstone, tier: api }
spec:
  selector: { app: api }
  ports:
    - name: http
      port: 8000
      targetPort: http
